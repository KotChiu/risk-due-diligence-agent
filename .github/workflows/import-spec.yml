name: Import agent design package

on:
  push:
    paths:
      - 'bootstrap/risk-spec.tar.xz.b64'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore validated specification files
        shell: bash
        run: |
          set -euo pipefail
          test -s bootstrap/risk-spec.tar.xz.b64
          base64 --decode bootstrap/risk-spec.tar.xz.b64 > /tmp/spec.tar.xz
          echo "c534f29363d1f8c6b1f284542d74e161a139f090b7b137934f053d992bd272c0  /tmp/spec.tar.xz" | sha256sum -c -
          mkdir -p /tmp/imported
          tar -xJf /tmp/spec.tar.xz -C /tmp/imported
          test -f /tmp/imported/risk-due-diligence-agent/README.md
          cp -a /tmp/imported/risk-due-diligence-agent/. .
          python -m pip install --quiet 'jsonschema>=4.20'
          python scripts/validate_examples.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .gitignore docs examples schemas scripts
          if ! git diff --cached --quiet; then
            git commit -m "docs: import full multi-turn risk agent specification"
            git push
          fi
